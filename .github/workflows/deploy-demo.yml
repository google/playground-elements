name: deploy-demo

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-demo:
    # Pinned because our Playwright version cannot install its system
    # dependencies on newer Ubuntu releases. Upgrade Playwright to unpin.
    runs-on: ubuntu-24.04

    permissions:
      contents: write # Needed to push the built demo to the gh-pages branch.

    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          # zizmor: ignore[artipacked] - credentials are used to push to gh-pages in the deploy step
          persist-credentials: true
      - uses: actions/setup-node@3235b876344d2a9aa001b8d1453c930bba69e610 # v3.9.1
        with:
          node-version: 20
          cache: npm
      - uses: google/wireit@9d7c2e5346f8ef1b1ab6014c4e96c74e234f7ed5 # setup-github-actions-caching/v2.0.4

      - run: npm ci
      - run: npx playwright install-deps
      - run: npx playwright install
      - run: npm run build

      - name: Deploy to gh-pages
        run: |
          cp -r configurator/deploy ..
          git fetch origin gh-pages --depth=1
          git checkout --track origin/gh-pages
          ls -A1 | grep -vx .git | xargs rm -rf
          mv ../deploy/* .
          if [[ -n $(git status -s) ]]
          then
            git config user.name "$GITHUB_ACTOR (bot)"
            git config user.email "$GITHUB_ACTOR@users.noreply.github.com"
            git add -A
            git commit -am "Deploy $GITHUB_SHA"
            git push
          fi
